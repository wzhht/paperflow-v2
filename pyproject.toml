[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "paperflow"
version = "0.2.0"
description = "Focused academic paper acquisition and LLM-ready Markdown pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "litdown==0.5.0",
    "httpx",
    "tenacity",
    "python-dotenv",
    "lxml",
    "pypdf",
    "typer",
    "rich",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]


[project.scripts]
paperflow = "paperflow.cli:app"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"